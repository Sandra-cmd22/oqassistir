<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Descubra os próximos lançamentos de filmes com informações completas">
  <meta name="theme-color" content="#000000">
  
  <!-- Open Graph / Facebook / WhatsApp / Instagram / Telegram / Discord -->
  <!-- Essas tags são fallback caso o React Helmet não carregue (SSR ou primeiro carregamento) -->
  <!-- Usando o logo do app (logomovie.png) como imagem de preview -->
  <meta property="og:title" content="CineBuzz - Próximos Lançamentos">
  <meta property="og:description" content="Descubra os próximos lançamentos de filmes, notícias do cinema e receba sugestões personalizadas">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" content="https://seusite.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CineBuzz">
  <meta property="og:locale" content="pt_BR">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CineBuzz - Próximos Lançamentos">
  <meta name="twitter:description" content="Descubra os próximos lançamentos de filmes, notícias do cinema e receba sugestões personalizadas">
  <meta name="twitter:image" content="/og-image.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png">
  <link rel="shortcut icon" href="/icons/icon-192.png">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS Safari PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cinema em Casa">
  <!-- iOS requer ícone 180x180 sem transparência - múltiplos tamanhos para compatibilidade -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="57x57" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  
  <!-- Prevent address bar from showing -->
  <meta name="format-detection" content="telephone=no">
  
  <title>CineBuzz - Próximos Lançamentos</title>
  
  <!-- Google Fonts - Montserrat e Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-hide {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    
    html {
      height: 100%;
      height: -webkit-fill-available;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      height: 100%;
      height: -webkit-fill-available;
      width: 100%;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      background-color: #000000;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-top: 24px;
      padding-bottom: 24px;
      background-color: #000000;
    }
    
    /* Hide browser UI on mobile */
    @media (display-mode: standalone) {
      body {
        padding-top: 0;
        padding-bottom: 0;
        padding-left: 0;
        padding-right: 0;
        background-color: #000000;
      }
      
      #root {
        padding-top: 0;
        padding-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Only register in production builds
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        }
      });
    }
  </script>
  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
